<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradKes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Background Circle Segi Delapan / Lotus Puskesmas -->
  <circle cx="50" cy="50" r="45" fill="#f0fdf4" stroke="#10b981" stroke-width="3"/>
  <circle cx="50" cy="50" r="40" fill="url(#gradKes)"/>
  <!-- Palang Hijau / Putih Medis -->
  <rect x="42" y="24" width="16" height="52" rx="4" fill="#ffffff"/>
  <rect x="24" y="42" width="52" height="16" rx="4" fill="#ffffff"/>
  <!-- Tunas Kesehatan / Jantung / Palang Tengah -->
  <circle cx="50" cy="50" r="9" fill="#10b981"/>
  <circle cx="50" cy="50" r="5" fill="#ffffff"/>
  <!-- Lingkaran Proteksi -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Label Text -->
  <text x="50" y="87" font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">BAKTI HUSADA</text>
</svg>
