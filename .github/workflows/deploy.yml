name: Deploy SI JAJUL to Hostinger

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: 🏗️ Build Production Bundle & Sync Assets
        run: |
          npm run build

      - name: 🔄 Sinkronisasi Hasil Build Produksi ke Repositori GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f dist/ assets/ images/ build-version.json package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(deploy): auto-sync production build bundle for Hostinger [skip ci]"
            git push
            echo "✅ Hasil build produksi dan assets terbaru berhasil di-push ke GitHub!"
          else
            echo "ℹ️ Hasil build produksi sudah sinkron dan tidak ada perubahan."
          fi

      - name: 📦 Simpan Hasil Build sebagai Artifact (ZIP Siap Pakai)
        uses: actions/upload-artifact@v4
        with:
          name: sijajul-hostinger-build
          path: dist/
          retention-days: 14

      - name: 🚀 Deploy ke Hostinger via FTP (Jika Secret FTP Dikonfigurasi)
        if: ${{ secrets.HOSTINGER_FTP_HOST != '' && secrets.HOSTINGER_FTP_USER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_FTP_DIR || 'public_html/' }}
          local-dir: ./dist/
          dangerous-clean-slate: false

      - name: 📡 Trigger Hostinger Auto-Deploy Webhook (Jika Dikonfigurasi)
        if: ${{ secrets.HOSTINGER_WEBHOOK_URL != '' }}
        run: |
          echo "Memanggil Webhook Auto-Deployment Hostinger..."
          curl -X POST -s "${{ secrets.HOSTINGER_WEBHOOK_URL }}" || true
          echo "Webhook berhasil dipanggil."

      - name: ℹ️ Informasi Status Deployment
        if: ${{ secrets.HOSTINGER_FTP_HOST == '' && secrets.HOSTINGER_WEBHOOK_URL == '' }}
        run: |
          echo "::notice ::Build produksi (dist/ & assets/) telah terkompilasi dan tersimpan di repositori GitHub."
          echo "Jika menggunakan Hostinger Git Deployment, klik tombol Deploy di hPanel Hostinger untuk menerapkan pembaruan secara instan."

      - name: 📋 Ringkasan Deployment
        run: |
          echo "=========================================================="
          echo "SI JAJUL - Build & Deploy Pipeline Sukses!"
          echo "Folder dist/ dan assets/ telah terkompilasi dan sinkron."
          echo "=========================================================="
